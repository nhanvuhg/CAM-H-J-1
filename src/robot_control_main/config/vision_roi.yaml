# ROI cho vision_decision_node.
#
# 12/08/2026: quy doi ca file tu he 640x480 (cham 15/7/2026) sang 640x360 —
# nhan truc Y voi 0.75, dung phep lam tron nhu node. Node truoc do scale y het
# nhu vay moi khung hinh, nen ket qua khong doi mot pixel nao; khac biet la
# ref_* gio bang dung kich thuoc anh, scale = 1.0, va ROI cham moi dan thang
# vao duoc.
#
# Cham lai: python3 ros2_ws/scripts/camera_tools/grab_roi_frames.py
#           python3 ros2_ws/scripts/camera_tools/roi_pick.py --cam camX
#           python3 ros2_ws/scripts/camera_tools/roi_preview.py --cam camX
# roi dan ket qua vao day, restart node (khong can build).
#
# Moi ROI = 4 goc [x, y] theo vong quanh (khong bat cheo).
# Thu tu slot1..slot10 = thu tu robot dat hang (khop pose index 14-23 trong
# joint_pose_params.yaml va nut O1-O10 tren GUI).
#
# anchor: [x1, y1, x2, y2] — AABB cua bbox class-0 "tray" tren DUNG khung hinh
# da dung de cham ROI o tren. Co no thi bat duoc ROI neo theo khay:
#     ros2 param set /vision_decision_node roi_anchor_mode tray
# hoac dat trong launch. Camera xe dich vai pixel thi ROI di theo khay thay vi
# dung yen va dem nham row. Lay so bang:
#     python3 ros2_ws/scripts/camera_tools/roi_preview.py --cam cam0
# (script in ra dong "anchor: [...]" san de dan vao day).
# Thieu anchor -> node tu quay ve ROI tinh va bao qua /vision/roi_status.

ref_width: 640
ref_height: 360

# cam0 — khay input, 1 outer (tray presence) + 5 row (R1-R5)
input_tray:
  # Cham lai 12/08/2026 tren anh 640x360 thuc te (~/Pictures/roi/cam0.jpg).
  # anchor = bbox class-0 do data_input_hp_final_2_fp16.engine tra ve tren DUNG
  # khung hinh do. Doi model hoac xe dich camera roi cham lai ROI thi phai lay
  # lai so nay cung luc.
  anchor: [145, 82, 487, 281]
  outer: [[146, 279], [184, 76], [456, 77], [488, 277]]
  rows:
    - [[170, 263], [202, 100], [244, 101], [225, 264]]   # row1
    - [[233, 265], [249, 100], [291, 102], [286, 265]]   # row2
    - [[292, 264], [298, 100], [339, 101], [345, 265]]   # row3
    - [[350, 264], [345, 100], [387, 101], [402, 264]]   # row4
    - [[408, 263], [392, 101], [434, 101], [460, 262]]   # row5

# cam1 — khay output, 1 outer (tray presence) + 10 slot
output_tray:
  # Cham lai 12/08/2026 tren anh 640x360 thuc te (~/Pictures/roi/cam1.jpg).
  # Bo ROI cu (15/7) da lech han: tren khay day 10 cartridge chi 5 cai roi vao
  # slot, ca hang tren truot ra ngoai — khay nam cao va lon hon trong khung so
  # voi luc do.
  # anchor = bbox class-0 do data_output_hp_final_fp16.engine tra ve tren DUNG
  # khung hinh do.
  # 12/08 sua tiep: slot1<->slot2 va slot3<->slot4 bi cham nguoc hang.
  # Quy uoc (giu tu file 15/7, khop pose 14-23): LE = hang DUOI,
  # CHAN = hang TREN. Slot 5-10 cham dung tu dau, khong dung toi.
  anchor: [113, 9, 579, 278]
  # Class-0 "tray" chi duoc phep bat tray-present khi tam bbox nam trong
  # vung nay; cartridge ngoai vung cung bi loai. Lay dung khung khay.
  outer: [[113, 278], [113, 9], [579, 9], [579, 278]]
  slots:
    - [[475, 254], [530, 254], [509, 138], [457, 137]]   # slot1
    - [[458, 129], [510, 129], [492, 33], [442, 34]]   # slot2
    - [[393, 255], [456, 254], [441, 137], [385, 139]]   # slot3
    - [[384, 130], [442, 130], [429, 35], [378, 37]]   # slot4
    - [[317, 254], [381, 253], [373, 142], [311, 141]]   # slot5
    - [[311, 133], [372, 134], [366, 37], [309, 35]]   # slot6
    - [[237, 254], [305, 254], [302, 144], [241, 142]]   # slot7
    - [[242, 137], [302, 136], [302, 35], [244, 34]]   # slot8
    - [[161, 255], [228, 253], [234, 140], [169, 140]]   # slot9
    - [[170, 135], [232, 134], [237, 37], [181, 40]]   # slot10
